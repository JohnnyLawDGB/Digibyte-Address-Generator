name: HoldFast Vault image
on:
  push:
    paths:
      - 'os/**'
      - 'dist/**'
      - '.github/workflows/os-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [qemu, rpi]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc cpio rsync unzip file wget curl xz-utils libssl-dev python3 qemu-system-arm
      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: os/.work/dl
          key: holdfast-dl-${{ matrix.target }}-${{ hashFiles('os/build.sh', 'os/configs/*', 'os/package/**') }}
          restore-keys: holdfast-dl-${{ matrix.target }}-
      - name: Build
        run: os/build.sh ${{ matrix.target }}
      - name: Boot test in QEMU
        if: matrix.target == 'qemu'
        run: python3 os/test/qemu-boot.py os/output/qemu/images/Image
      - name: Package Raspberry Pi image
        if: matrix.target == 'rpi'
        run: |
          cd os/output/rpi/images
          cat holdfast-vault-rpi.img.sha256
          xz -T0 -6 holdfast-vault-rpi.img
          sha256sum holdfast-vault-rpi.img.xz | tee holdfast-vault-rpi.img.xz.sha256
      - name: Upload Raspberry Pi image
        if: matrix.target == 'rpi'
        uses: actions/upload-artifact@v4
        with:
          name: holdfast-vault-rpi
          path: |
            os/output/rpi/images/holdfast-vault-rpi.img.xz
            os/output/rpi/images/holdfast-vault-rpi.img.xz.sha256
            os/output/rpi/images/holdfast-vault-rpi.img.sha256
          if-no-files-found: error
